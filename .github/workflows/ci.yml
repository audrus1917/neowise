name: CI and delivery

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Run HTTP regression tests
        run: node --test test/triage.test.mjs

  docker:
    name: Docker build and tests
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOCAL_IMAGE: neowise-ci:${{ github.sha }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build image
        run: docker build --label "org.opencontainers.image.source=$SOURCE_URL" --tag "$LOCAL_IMAGE" .
      - name: Run tests inside the image
        run: docker run --rm "$LOCAL_IMAGE" node --test test/triage.test.mjs
      - name: Start container
        run: docker run --detach --name neowise-smoke --publish 127.0.0.1:3000:3000 "$LOCAL_IMAGE"
      - name: Check the published HTTP port
        run: node scripts/smoke.mjs
      - name: Show logs and remove container
        if: always()
        run: |
          if docker container inspect neowise-smoke >/dev/null 2>&1; then
            docker logs neowise-smoke
            docker rm --force neowise-smoke
          fi
      - name: Export verified image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save --output "$RUNNER_TEMP/neowise-image.tar" "$LOCAL_IMAGE"
      - name: Upload verified image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-image
          path: ${{ runner.temp }}/neowise-image.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish image to GHCR
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE: neowise-ci:${{ github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-image
          path: ${{ runner.temp }}
      - name: Load verified image
        run: docker load --input "$RUNNER_TEMP/neowise-image.tar"
      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish commit and latest tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$LOCAL_IMAGE" "$image:sha-$GITHUB_SHA"
          docker tag "$LOCAL_IMAGE" "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
          printf 'Published `%s:sha-%s` and `%s:latest`.\n' "$image" "$GITHUB_SHA" "$image" >> "$GITHUB_STEP_SUMMARY"
